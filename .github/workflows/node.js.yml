name: Node.js CI

on:
  push:
    branches: [ "publish" ]
  pull_request:
    branches: [ "publish" ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - run: npm install

    # 可选：快速验证入口文件是否能被正常加载
    - run: node run.mjs --help || true
